<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QR Menu — Админка</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<main class="admin-shell">
  <div class="admin-head"><div><div class="muted">QR MENU PLATFORM</div><h1>Админка</h1></div><a class="secondary" href="/r/demo" target="_blank">Открыть демо</a></div>

  <section class="panel">
    <h2>Новое заведение</h2>
    <p class="muted">Введи данные клиента. Ссылку система создаст сама.</p>
    <form id="restaurantForm" class="form-grid cols">
      <label><span class="muted">Название</span><input name="name" id="restaurantNameInput" placeholder="Например: Nurislam Bar" required></label>
      <label><span class="muted">Ссылка меню — создаётся автоматически</span><input name="slug" id="slugInput" placeholder="nurislam-bar" autocomplete="off"></label>
      <label><span class="muted">Подзаголовок</span><input name="subtitle" placeholder="Например: Шошқатыр бар • Шымкент"></label>
      <label><span class="muted">WhatsApp</span><input name="phone" inputmode="tel" placeholder="Например: 87781352012"></label>
      <label><span class="muted">Адрес</span><input name="address" placeholder="Например: Спатаева 11"></label>
      <label><span class="muted">Обслуживание</span><input name="service" placeholder="Например: Обслуживание 10%"></label>
      <button class="primary" type="submit">Создать заведение</button>
    </form>
    <div id="status" class="status muted"></div>
  </section>

  <section class="panel"><h2>Заведения</h2><div id="restaurants">Загрузка…</div></section>

  <section id="editor" class="panel" hidden>
    <div class="admin-head"><div><div class="muted">Редактирование</div><h2 id="editorTitle">Заведение</h2></div><div class="restaurant-actions"><button id="copyMenuLink" class="secondary" type="button">Копировать ссылку</button><a id="menuLink" class="secondary" target="_blank">Открыть меню</a><a id="qrLink" class="secondary" target="_blank" download>QR-код</a></div></div>

    <h3>Данные заведения</h3>
    <form id="restaurantEditForm" class="form-grid cols">
      <input name="name" placeholder="Название" required>
      <input name="subtitle" placeholder="Подзаголовок">
      <input name="phone" inputmode="tel" placeholder="WhatsApp">
      <input name="address" placeholder="Адрес">
      <input name="service" placeholder="Обслуживание">
      <button class="primary" type="submit">Сохранить данные</button>
    </form>

    <h3>Добавить категорию</h3><form id="categoryForm" class="form-grid cols"><input name="name" placeholder="Например: Салаты" required><button class="primary" type="submit">Добавить категорию</button></form>

    <h3>Добавить блюдо</h3>
    <form id="dishForm" class="form-grid cols">
      <select name="category_id" id="dishCategory" required></select>
      <input name="name" placeholder="Название блюда" required>
      <input name="price" type="number" min="0" step="1" placeholder="Цена, ₸" required>
      <input name="image_url" placeholder="Или ссылка на фото">
      <label><span class="muted">Фото с телефона/компьютера</span><input id="dishPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <input name="emoji" placeholder="Иконка, например 🍕">
      <input name="badge" placeholder="Метка: Хит / Новинка">
      <textarea name="description" placeholder="Описание блюда"></textarea>
      <button class="primary" type="submit">Добавить блюдо</button>
    </form>
    <p class="file-note">Фото автоматически уменьшается перед сохранением.</p>

    <h3>Текущее меню</h3><div id="menuEditor"></div>
  </section>
</main>
<script src="/admin.js"></script>
</body></html>
