<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QR Menu — кабинет клиента</title><link rel="stylesheet" href="/styles.css?v=portal1"><link rel="stylesheet" href="/portal.css?v=portal1"></head><body class="client-page"><main class="client-shell"><section id="loginView" class="client-login"><div class="muted">QR MENU</div><h1>Личный кабинет</h1><p class="muted">Войдите, чтобы управлять только своим заведением.</p><form id="loginForm" class="form-grid"><input name="username" autocomplete="username" placeholder="Логин" required><input name="password" type="password" autocomplete="current-password" placeholder="Пароль" required><button class="primary" type="submit">Войти</button></form><div id="loginStatus" class="client-status"></div></section><section id="dashboard" hidden><div class="client-toolbar"><div><div class="muted">ЛИЧНЫЙ КАБИНЕТ</div><h1 id="clientTitle">Заведение</h1></div><div class="client-actions"><a id="publicMenu" class="secondary" target="_blank">Открыть меню</a><a id="publicQr" class="secondary" target="_blank">QR-код</a><button id="logout" class="secondary" type="button">Выйти</button></div></div><div id="clientStatus" class="client-status"></div><div class="client-grid"><section class="client-card"><h2>Данные заведения</h2><form id="clientRestaurantForm" class="form-grid"><input name="name" placeholder="Название" required><input name="subtitle" placeholder="Подзаголовок"><input name="phone" inputmode="tel" placeholder="WhatsApp"><input name="address" placeholder="Адрес"><input name="service" placeholder="Обслуживание"><button class="primary" type="submit">Сохранить</button></form></section><section class="client-card"><h2>Оформление</h2><form id="clientBrandingForm" class="form-grid"><label><span class="muted">Основной цвет</span><input name="accent_color" type="color"></label><label><span class="muted">Тема</span><select name="theme"><option value="light">Светлая</option><option value="warm">Тёплая</option><option value="dark">Тёмная</option></select></label><input name="logo_url" placeholder="Ссылка на логотип"><label><span class="muted">Или загрузить логотип</span><input id="clientLogoPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><input name="hero_image_url" placeholder="Ссылка на обложку"><label><span class="muted">Или загрузить обложку</span><input id="clientHeroPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="primary" type="submit">Сохранить оформление</button></form></section><section class="client-card"><h2>Категории</h2><form id="clientCategoryForm" class="form-grid"><input name="name" placeholder="Новая категория" required><button class="primary" type="submit">Добавить</button></form><div id="clientCategories" class="muted"></div></section><section class="client-card"><h2 id="clientDishTitle">Добавить блюдо</h2><form id="clientDishForm" class="form-grid"><select name="category_id" id="clientDishCategory" required></select><input name="name" placeholder="Название" required><input name="price" type="number" min="0" step="1" placeholder="Цена, ₸" required><textarea name="description" placeholder="Описание"></textarea><input name="badge" placeholder="Метка: Хит / Новинка"><input name="image_url" placeholder="Ссылка на фото"><label><span class="muted">Или загрузить фото</span><input id="clientDishPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="client-actions"><button id="clientDishSubmit" class="primary" type="submit">Добавить блюдо</button><button id="clientDishCancel" class="secondary" type="button" hidden>Отмена</button></div></form></section><section class="client-card full"><h2>Текущее меню</h2><div id="clientMenuEditor"></div></section></div></section></main><script src="/client.js?v=portal1"></script></body></html>
