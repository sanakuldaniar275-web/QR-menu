<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18392b">
  <title>QR Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__top"><span class="logo">QR MENU</span><span class="badge">RU</span></div>
    <p id="restaurantSubtitle" class="eyebrow">Загрузка меню…</p>
    <h1 id="restaurantName">QR Menu</h1>
    <p>Выберите категорию и найдите любимое блюдо.</p>
  </header>

  <main>
    <div class="search-wrap"><input id="search" type="search" placeholder="Поиск по меню…" aria-label="Поиск по меню"></div>
    <nav id="categories" class="categories" aria-label="Категории"></nav>
    <section id="menu" class="menu" aria-live="polite"></section>
  </main>

  <footer><strong>QR Menu</strong><span>Цифровое меню для кафе и ресторанов</span></footer>
  <script src="/app.js"></script>
</body>
</html>
