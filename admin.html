<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Menu — Админка</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="admin-shell">
    <div class="admin-head">
      <div><div class="muted">QR MENU</div><h1>Админка</h1></div>
      <a class="secondary" href="/r/demo" target="_blank">Открыть демо</a>
    </div>

    <section class="panel">
      <h2>Новое заведение</h2>
      <form id="restaurantForm" class="form-grid cols">
        <input name="name" placeholder="Название заведения" required>
        <input name="slug" placeholder="Ссылка, например arman-cafe" pattern="[a-z0-9-]+" required>
        <input name="subtitle" placeholder="Короткое описание">
        <input name="phone" placeholder="Телефон / WhatsApp">
        <button class="primary" type="submit">Создать заведение</button>
      </form>
      <div id="status" class="status muted"></div>
    </section>

    <section class="panel">
      <h2>Заведения</h2>
      <div id="restaurants">Загрузка…</div>
    </section>

    <section id="editor" class="panel" hidden>
      <div class="admin-head">
        <div><div class="muted">Редактирование меню</div><h2 id="editorTitle">Заведение</h2></div>
        <div class="restaurant-actions">
          <a id="menuLink" class="secondary" target="_blank">Открыть меню</a>
          <a id="qrLink" class="secondary" target="_blank">Открыть QR</a>
        </div>
      </div>

      <h3>Добавить категорию</h3>
      <form id="categoryForm" class="form-grid cols">
        <input name="name" placeholder="Например: Салаты" required>
        <button class="primary" type="submit">Добавить категорию</button>
      </form>

      <h3>Добавить блюдо</h3>
      <form id="dishForm" class="form-grid cols">
        <select name="category_id" id="dishCategory" required></select>
        <input name="name" placeholder="Название блюда" required>
        <input name="price" type="number" min="0" step="1" placeholder="Цена, ₸" required>
        <input name="image_url" placeholder="Ссылка на фото (пока необязательно)">
        <textarea name="description" placeholder="Описание блюда"></textarea>
        <button class="primary" type="submit">Добавить блюдо</button>
      </form>

      <h3>Текущее меню</h3>
      <div id="menuEditor"></div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
